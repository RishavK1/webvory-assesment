# Brings the whole stack up on PostgreSQL with one command:
#
#   docker compose up --build
#
# Frontend  ->  http://localhost:5173
# API docs  ->  http://localhost:8000/docs

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: webvory
      POSTGRES_PASSWORD: webvory
      POSTGRES_DB: webvory
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The backend waits for this, so migrations never race an unready server.
      test: ['CMD-SHELL', 'pg_isready -U webvory -d webvory']
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://webvory:webvory@db:5432/webvory
      JWT_SECRET: docker-dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DEBUG: 'false'
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  postgres_data:
